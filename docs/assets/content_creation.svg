<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#0b1120" viewBox="0 0 356 498" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="workflow graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker></defs><path d="M 123.0 104.0 C 123.0 132.0, 123.0 122.0, 123.0 150.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>plan → draft</title></path><text x="129" y="131" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">大纲</text><path d="M 123.0 226.0 C 123.0 254.0, 123.0 244.0, 123.0 272.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>draft → edit</title></path><text x="129" y="253" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">初稿</text><path d="M 218.0 310.0 C 320.0 310.0, 320.0 188.0, 218.0 188.0" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-back)"><title>edit → draft  [verdict == &#x27;needs_revision&#x27; and revision &lt; inputs.max_revisions]</title></path><text x="230" y="253" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">需要修订</text><path d="M 123.0 348.0 C 123.0 376.0, 123.0 366.0, 123.0 394.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>edit → publish  [verdict == &#x27;pass&#x27;]</title></path><text x="129" y="375" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">审校通过</text><path d="M 123.0 348.0 C 123.0 376.0, 123.0 366.0, 123.0 394.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>edit → publish  [verdict == &#x27;needs_revision&#x27; and revision &gt;= inputs.max_revisions]</title></path><text x="129" y="375" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">达到修订上限</text><g><title>规划 Agent · planner · author</title><rect x="28.0" y="28.0" width="190" height="76" rx="10" fill="#111a2e" stroke="#6366f1" stroke-width="2"/><rect x="28.0" y="28.0" width="5" height="76" rx="2.5" fill="#6366f1"/><text x="44" y="53" fill="#e2e8f0" font-size="13" font-weight="600">规划 Agent</text><text x="44" y="72" fill="#94a3b8" font-size="11">planner</text><text x="44" y="91" fill="#6366f1" font-size="10.5" font-family="ui-monospace, monospace">author · plan</text><circle cx="204" cy="41" r="5" fill="#6366f1"/></g><g><title>写作 Agent · writer · author</title><rect x="28.0" y="150.0" width="190" height="76" rx="10" fill="#111a2e" stroke="#6366f1" stroke-width="2"/><rect x="28.0" y="150.0" width="5" height="76" rx="2.5" fill="#6366f1"/><text x="44" y="175" fill="#e2e8f0" font-size="13" font-weight="600">写作 Agent</text><text x="44" y="194" fill="#94a3b8" font-size="11">writer</text><text x="44" y="213" fill="#6366f1" font-size="10.5" font-family="ui-monospace, monospace">author · draft</text><circle cx="204" cy="163" r="5" fill="#6366f1"/></g><g><title>审校 Agent · editor · review</title><rect x="28.0" y="272.0" width="190" height="76" rx="10" fill="#111a2e" stroke="#0ea5e9" stroke-width="2"/><rect x="28.0" y="272.0" width="5" height="76" rx="2.5" fill="#0ea5e9"/><text x="44" y="297" fill="#e2e8f0" font-size="13" font-weight="600">审校 Agent</text><text x="44" y="316" fill="#94a3b8" font-size="11">editor</text><text x="44" y="335" fill="#0ea5e9" font-size="10.5" font-family="ui-monospace, monospace">review · edit</text><circle cx="204" cy="285" r="5" fill="#0ea5e9"/></g><g><title>发布 Agent · publisher · deliver</title><rect x="28.0" y="394.0" width="190" height="76" rx="10" fill="#111a2e" stroke="#22c55e" stroke-width="2"/><rect x="28.0" y="394.0" width="5" height="76" rx="2.5" fill="#2