b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">轮次超限</text><path d="M 235.0 348.0 C 235.0 376.0, 123.0 366.0, 123.0 394.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>aggregate → fix_errors  [verdict == &#x27;fail&#x27;]</title></path><text x="185" y="375" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">存在阻塞问题</text><path d="M 235.0 348.0 C 235.0 376.0, 347.0 366.0, 347.0 394.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>aggregate → fix_warnings  [verdict == &#x27;pass_with_warnings&#x27;]</title></path><text x="297" y="375" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">仅剩风格告警</text><path d="M 235.0 348.0 C 235.0 432.0, 123.0 432.0, 123.0 516.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>aggregate → finalize  [verdict == &#x27;pass&#x27;]</title></path><text x="185" y="436" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">通过</text><path d="M 123.0 470.0 C 123.0 498.0, 347.0 488.0, 347.0 516.0" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"><title>fix_errors → escalate  [fixed_count == 0]</title></path><text x="241" y="497" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">无法自动修复</text><path d="M 218.0 432.0 C 276.0 432.0, 276.0 188.0, 218.0 188.0" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-back)"><title>fix_errors → review_style  [fixed_count &gt; 0]</title></path><text x="230" y="314" fill="#94a3b8" font-size="10" text-anchor="start" font-family="ui-monospace, monospace">修复后复审</text><path d="M 218.0 432.0 C 298.0 432.0, 522.0 188.0, 442.0 188.0" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-back)"><title>fix_errors → review_security  [fixed_count